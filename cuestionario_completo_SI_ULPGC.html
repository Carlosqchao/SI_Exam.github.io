<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguridad de la Información · ULPGC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f0e17;
  --ink2: #2e2d3a;
  --ink3: #6b6880;
  --paper: #faf9f6;
  --paper2: #f2f0eb;
  --paper3: #e8e5de;
  --accent: #c84b31;
  --accent2: #e8623d;
  --ok: #1a7a50;
  --ok-bg: #e6f5ed;
  --ng: #b5291a;
  --ng-bg: #fdecea;
  --blue: #2a5caa;
  --blue-bg: #e8eef8;
  --radius: 12px;
  --radius-lg: 18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── HEADER ── */
.site-header {
  width: 100%;
  background: var(--ink);
  color: var(--paper);
  padding: 2.5rem 2rem 2rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.site-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 18px,
    rgba(255,255,255,.03) 18px,
    rgba(255,255,255,.03) 36px
  );
}
.site-header .badge {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent2);
  border: 1px solid var(--accent);
  padding: 4px 12px;
  border-radius: 99px;
  margin-bottom: 1rem;
  position: relative;
}
.site-header h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 400;
  line-height: 1.15;
  position: relative;
  letter-spacing: -.01em;
}
.site-header h1 em {
  font-style: italic;
  color: var(--accent2);
}
.site-header p {
  margin-top: .75rem;
  font-size: 14px;
  color: rgba(250,249,246,.55);
  position: relative;
  font-weight: 300;
}

/* ── STATS BAR ── */
.stats-bar {
  width: 100%;
  max-width: 720px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--paper3);
  border-bottom: 1px solid var(--paper3);
}
.stat {
  background: var(--paper);
  padding: .85rem 1rem;
  text-align: center;
}
.stat-val {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  color: var(--ink);
  line-height: 1;
  display: block;
}
.stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink3);
  font-weight: 500;
  margin-top: 4px;
  display: block;
}

/* ── MAIN QUIZ AREA ── */
.quiz-wrap {
  width: 100%;
  max-width: 720px;
  padding: 2.5rem 2rem 4rem;
  flex: 1;
}

/* ── PROGRESS ── */
.progress-section {
  margin-bottom: 2rem;
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.q-number {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--ink3);
  letter-spacing: .06em;
}
.q-ua-tag {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: var(--ink);
  color: var(--paper);
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: .06em;
}
.progress-track {
  height: 4px;
  background: var(--paper3);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
}
.score-mini {
  display: flex;
  gap: 16px;
  margin-top: 8px;
}
.score-ok { font-size: 12px; color: var(--ok); font-weight: 500; }
.score-ng { font-size: 12px; color: var(--ng); font-weight: 500; }

/* ── QUESTION ── */
.question-card {
  background: white;
  border: 1px solid var(--paper3);
  border-radius: var(--radius-lg);
  padding: 2rem 1.75rem 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 1px 3px rgba(15,14,23,.06);
}
.question-text {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  line-height: 1.55;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 1.5rem;
}

/* ── OPTIONS ── */
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--paper3);
  border-radius: var(--radius);
  background: var(--paper);
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.5;
  transition: border-color .15s, background .15s, transform .1s;
  font-family: 'DM Sans', sans-serif;
}
.opt:hover:not(:disabled) {
  border-color: var(--ink3);
  background: var(--paper2);
  transform: translateX(3px);
}
.opt-letter {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--paper3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  transition: all .15s;
  background: white;
}
.opt:hover:not(:disabled) .opt-letter {
  border-color: var(--ink);
  color: var(--ink);
}

/* States */
.opt.correct {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: #0f4a30;
  transform: none;
}
.opt.correct .opt-letter {
  background: var(--ok);
  border-color: var(--ok);
  color: white;
}
.opt.wrong {
  border-color: var(--ng);
  background: var(--ng-bg);
  color: #6e170e;
  transform: none;
}
.opt.wrong .opt-letter {
  background: var(--ng);
  border-color: var(--ng);
  color: white;
}
.opt.reveal {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: #0f4a30;
}
.opt.reveal .opt-letter {
  background: var(--ok);
  border-color: var(--ok);
  color: white;
}

/* ── FEEDBACK ── */
.feedback {
  border-radius: var(--radius);
  padding: 14px 16px;
  font-size: 13.5px;
  line-height: 1.6;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-bottom: 1.5rem;
  animation: fadeUp .25s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.feedback.ok {
  background: var(--ok-bg);
  color: #0f4a30;
  border-left: 3px solid var(--ok);
}
.feedback.ng {
  background: var(--ng-bg);
  color: #6e170e;
  border-left: 3px solid var(--ng);
}
.feedback-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── NAV ── */
.nav-area {
  display: flex;
  justify-content: flex-end;
}
.btn-next {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  padding: 11px 24px;
  border-radius: var(--radius);
  border: 1.5px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background .15s, transform .1s;
}
.btn-next:hover {
  background: var(--ink2);
  transform: translateY(-1px);
}
.btn-next .arrow {
  font-size: 16px;
  transition: transform .15s;
}
.btn-next:hover .arrow { transform: translateX(3px); }

/* ── RESULT SCREEN ── */
.result-screen {
  text-align: center;
  padding: 2rem 0 3rem;
  animation: fadeUp .4s ease;
}
.result-emoji {
  font-size: 52px;
  margin-bottom: .75rem;
  display: block;
}
.result-title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(3rem, 10vw, 5.5rem);
  font-weight: 400;
  line-height: 1;
  color: var(--ink);
  letter-spacing: -.03em;
}
.result-pct {
  font-family: 'DM Serif Display', serif;
  font-size: 1.2rem;
  color: var(--ink3);
  margin: .4rem 0 .75rem;
  font-style: italic;
}
.result-msg {
  font-size: 15px;
  color: var(--ink2);
  margin-bottom: 2.5rem;
}
.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 2.5rem;
  text-align: left;
}
.r-card {
  background: white;
  border: 1px solid var(--paper3);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
}
.r-card-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink3);
  font-weight: 500;
  margin-bottom: 6px;
  display: block;
}
.r-card-val {
  font-family: 'DM Serif Display', serif;
  font-size: 1.75rem;
  color: var(--ink);
  line-height: 1;
}
.r-card-val.ok { color: var(--ok); }
.r-card-val.ng { color: var(--ng); }
.r-card-val.sm { font-size: 1.1rem; }

/* UA breakdown */
.ua-breakdown {
  margin-bottom: 2.5rem;
  text-align: left;
}
.ua-breakdown h3 {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink3);
  margin-bottom: 10px;
}
.ua-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}
.ua-name {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  min-width: 42px;
  color: var(--ink3);
}
.ua-bar-bg {
  flex: 1;
  height: 8px;
  background: var(--paper3);
  border-radius: 99px;
  overflow: hidden;
}
.ua-bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--ok);
  transition: width .8s cubic-bezier(.4,0,.2,1);
}
.ua-bar-fill.low { background: var(--ng); }
.ua-bar-fill.mid { background: #e08c00; }
.ua-score {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink3);
  min-width: 36px;
  text-align: right;
}

.btn-retry {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  padding: 14px 36px;
  border-radius: var(--radius);
  border: 1.5px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn-retry:hover { background: var(--ink2); transform: translateY(-2px); }

/* ── START SCREEN ── */
.start-screen {
  text-align: center;
  padding: 3rem 0;
  animation: fadeUp .4s ease;
}
.start-screen h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 2rem;
  font-weight: 400;
  margin-bottom: 1rem;
}
.start-screen p {
  font-size: 14px;
  color: var(--ink3);
  max-width: 420px;
  margin: 0 auto 2rem;
  line-height: 1.7;
}
.ua-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 2.5rem;
}
.ua-chip {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: var(--paper2);
  border: 1px solid var(--paper3);
  border-radius: 99px;
  padding: 5px 14px;
  color: var(--ink2);
  cursor: pointer;
  transition: all .15s;
  user-select: none;
}
.ua-chip.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.mode-toggle {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 2rem;
}
.mode-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: var(--radius);
  border: 1.5px solid var(--paper3);
  background: var(--paper);
  color: var(--ink2);
  cursor: pointer;
  transition: all .15s;
}
.mode-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: #fef3f0;
}
.btn-start {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 600;
  padding: 15px 48px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  transition: background .15s, transform .1s;
  letter-spacing: .01em;
}
.btn-start:hover { background: #b0391f; transform: translateY(-2px); }

/* Footer */
.site-footer {
  width: 100%;
  border-top: 1px solid var(--paper3);
  padding: 1.25rem 2rem;
  text-align: center;
  font-size: 12px;
  color: var(--ink3);
  font-family: 'DM Mono', monospace;
  letter-spacing: .04em;
  background: var(--paper);
}

@media (max-width: 500px) {
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .result-grid { grid-template-columns: 1fr 1fr; }
  .quiz-wrap { padding: 1.5rem 1.25rem 3rem; }
  .question-text { font-size: 1.05rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="badge">ULPGC · 4º Grado en Ingeniería Informática</div>
  <h1>Seguridad de la <em>Información</em></h1>
  <p>Banco oficial de preguntas · UA 1 – UA 6 · Todas las respuestas verificadas</p>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-val" id="s-total">120</span><span class="stat-label">Preguntas</span></div>
  <div class="stat"><span class="stat-val" id="s-done">0</span><span class="stat-label">Respondidas</span></div>
  <div class="stat"><span class="stat-val ok" id="s-ok">0</span><span class="stat-label">Correctas</span></div>
  <div class="stat"><span class="stat-val ng" id="s-ng">0</span><span class="stat-label">Incorrectas</span></div>
</div>

<main class="quiz-wrap">
  <div id="screen"></div>
</main>

<footer class="site-footer">
  Seguridad de la Información · ULPGC · Banco de preguntas oficial hasta 2024
</footer>

<script>
const ALL=[
{u:"UA 1",t:"A la hora de analizar la seguridad de la información debemos plantearnos las siguientes cuestiones básicas:",o:["Qué proteger, contra quién, cómo y hasta dónde","Qué proteger, de qué manera y hasta cuándo","Qué proteger, contra quién y cómo","Cuándo, cómo y dónde"],a:0},
{u:"UA 1",t:"La Disponibilidad supone...",o:["Que la información sólo debe ser accesible por personas autorizadas","Evitar que la información sea alterada sin autorización","Que la información esté disponible cuando sea necesario y por quien esté autorizado","Disponer de la información siempre que sea posible"],a:2},
{u:"UA 1",t:"La diferencia entre datos e información radica en...",o:["No hay diferencias","Los datos son la materia prima de la información; ésta es el resultado de procesarlos","Los datos son un tipo específico de información","Los datos son la materia prima; la información es un repositorio global de datos"],a:1},
{u:"UA 1",t:"¿Qué aspectos trata de garantizar la Seguridad de la Información?",o:["Disponibilidad, Integridad, Confidencialidad y No repudio","Disponibilidad, Integridad, Confidencialidad, No repudio y Autenticación en ordenadores","Disponibilidad, Integridad, Confidencialidad, No repudio y Autenticación con independencia del medio físico","Disponibilidad, Integridad, Confidencialidad, No repudio y Clasificación con independencia del medio físico"],a:2},
{u:"UA 1",t:"La seguridad se considera un:",o:["Producto","Proceso","Activo","Elemento prescindible de la organización"],a:1},
{u:"UA 1",t:"La característica de la información asociada a la FIABILIDAD es la:",o:["Autenticación","No Repudio","Confidencialidad","Integridad"],a:3},
{u:"UA 1",t:"La INTEGRIDAD es la característica de la información:",o:["Relacionada con la no revelación de secretos","Relacionada con evitar que la información sea alterada sin autorización","Vinculada a que quien corresponda tenga acceso cuando lo necesite","Relacionada con evitar que la información sea accesible por personas no autorizadas"],a:1},
{u:"UA 1",t:"Algunas características que debe tener una Política de Seguridad son:",o:["Mejorable e Inteligible","Todas las respuestas son correctas","Abarcable y de obligado cumplimiento","Asequible"],a:1},
{u:"UA 1",t:"¿Cuáles son las principales medidas a considerar con el personal de una organización en relación a la seguridad?",o:["Formación, Fiabilidad y Seguimiento","Concienciación, Fiabilidad y Seguimiento","Formación, Acuerdos de confidencialidad y Seguimiento","Formación, Vigilancia y Aplicación de políticas de restricción de accesos"],a:2},
{u:"UA 1",t:"La SEGURIDAD INFORMÁTICA es:",o:["Una disciplina que diseña normas, procedimientos y técnicas para el procesamiento seguro de datos en sistemas informáticos","Una disciplina que diseña las políticas de seguridad de las empresas","Una metodología que aplica normas y técnicas para el procesamiento seguro de señales en sistemas informáticos","Una disciplina que diseña políticas de seguridad en empresas y administración pública"],a:0},
{u:"UA 1",t:"Los factores de autenticación son:",o:["Identidad, posesión y existencia","Conocimiento, posesión y existencia","Identidad, conocimiento y existencia","Identidad, posesión y conocimiento"],a:1},
{u:"UA 1",t:"¿En cuál de estas ciencias o técnicas NO se aplica el principio de seguridad a través del conocimiento?",o:["Esteganografía","Criptología","Biometría","En ninguna de las indicadas"],a:0},
{u:"UA 2",t:"¿Cómo se define el concepto de PRIVACIDAD?",o:["El ámbito de la vida pública que se debe proteger de cualquier intromisión","El ámbito de la vida privada que se debe proteger de la intromisión del estado","El ámbito de la vida privada que se debe proteger de cualquier intromisión","El ámbito de la vida pública que se debe proteger de la intromisión de los medios"],a:2},
{u:"UA 2",t:"¿Cuáles son las tres dimensiones más importantes de la seguridad que configuran la privacidad?",o:["Integridad, Confidencialidad y Autenticación","Integridad, Confidencialidad y No repudio","Autenticación, Trazabilidad y No repudio","Confidencialidad, Temporalidad y No repudio"],a:0},
{u:"UA 2",t:"¿Qué requisito básico de seguridad es necesario para garantizar la privacidad en los medios digitales?",o:["Enviar los mensajes a través de correo electrónico","El cifrado de la información","La securización de las redes digitales","No enviar mensajes a través de Internet"],a:1},
{u:"UA 2",t:"¿Qué problema principal presentan los algoritmos de clave privada?",o:["Su excesiva lentitud","La debilidad de la clave","La complejidad para su uso","La transmisión de la clave al destinatario de forma segura"],a:3},
{u:"UA 2",t:"Los sistemas de clave simétrica...",o:["Aseguran la integridad","Aseguran la disponibilidad","Aseguran la confidencialidad","Aseguran el No repudio"],a:2},
{u:"UA 2",t:"¿Qué significa la SIMETRÍA en el concepto de clave simétrica?",o:["Que se utiliza una pareja de claves: una para cifrar y otra para descifrar","Que se utiliza la misma clave tanto para cifrar como para descifrar","Que se usa una clave para cifrar pero no es necesaria para descifrar","Que no se requieren claves para el cifrado"],a:1},
{u:"UA 2",t:"¿Qué aspectos determinan la potencia de los sistemas de cifrado simétrico?",o:["La calidad de la clave y la extensión del algoritmo","La potencia del algoritmo y el tamaño de la clave","La cantidad de usos del algoritmo y el tamaño de la clave","El secreto del algoritmo y la longitud de la clave"],a:0},
{u:"UA 2",t:"¿Qué algoritmo de clave privada ha sustituido al DES?",o:["Doble DES (DDES)","Triple DES (TDES)","Cuádruple DES (QDES)","Séxtuple DES (SDES)"],a:1},
{u:"UA 2",t:"¿Qué posible problema se puede plantear en el uso de sistemas de clave pública?",o:["La dificultad para utilizar los algoritmos requeridos","El coste computacional","El intercambio de las claves públicas entre los agentes que se comunican","La pérdida o sustracción de la clave privada"],a:2},
{u:"UA 2",t:"¿En qué se basa un algoritmo de clave asimétrica?",o:["En el uso de claves de distinta longitud para cifrar cada mensaje","En el uso de dos claves apareadas: una para cifrar y otra para descifrar","En la aplicación del algoritmo de Diffie-John","En el uso de tres claves: dos para cifrar y otra para descifrar"],a:1},
{u:"UA 2",t:"¿En qué se basa el funcionamiento del sistema RSA?",o:["En la longitud de los números enteros","En ocultar la clave pública para evitar el descifrado","En la imposibilidad computacional de factorizar números enteros muy grandes","En la imposibilidad de dividir números irracionales"],a:2},

{u:"UA 6",t:"Dentro de las etapas para el establecimiento de un SGSI, ¿qué elemento es necesario definir?",o:["La Política de negocio de la organización","La Política de Seguridad","La Estrategia de negocio","La Política de buen gobierno"],a:1},
{u:"UA 6",t:"¿Qué cuatro etapas plantea el Ciclo PDCA o Ciclo de Deming?",o:["Pensar, Hacer, Recordar y Analizar","Pensar, Hacer, Revisar y Actuar","Planificar, Hacer, Revisar y Actuar","Planificar, Hacer, Revisar y Analizar"],a:2},
{u:"UA 6",t:"Dentro de los estándares ISO/IEC, ¿a qué ámbito se ha asignado el rango 27.000?",o:["A la gestión de las tecnologías de la información","A la privacidad de la información","A la seguridad de la información","A las metodologías de gestión de riesgos"],a:2},
{u:"UA 6",t:"Los estándares ISO/IEC 27.001 y 27.002 ¿a qué ámbito pertenecen?",o:["A la privacidad de la información","A las metodologías de gestión de riesgos","A la seguridad de la información","A ninguno de los anteriores"],a:2},
{u:"UA 6",t:"El RD-Ley 12/2018 asigna como CSIRT de notificación de incidentes para la red académica española a:",o:["INCIBE-CERT","IRIS-CERT","CCN-CERT","ESP DEF"],a:0}
];

const L=['A','B','C','D'];
let pool=[],cur=0,score=0,ans=false,hist=[];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function updateStatsBar(){
  const done=cur;const ok=score;const ng=done-ok;
  document.getElementById('s-total').textContent=pool.length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-ng').textContent=ng;
}

function showStart(){
  const uas=[...new Set(ALL.map(q=>q.u))];
  const s=document.getElementById('screen');
  s.innerHTML=`<div class="start-screen">
    <h2>¿Por dónde quieres empezar?</h2>
    <p>Selecciona las unidades temáticas que quieres practicar. Puedes hacer el banco completo o centrarte en las que más te cuestan.</p>
    <div class="ua-chips" id="chips">
      ${uas.map(u=>`<span class="ua-chip active" data-ua="${u}">${u}</span>`).join('')}
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-all" onclick="setMode('all')">Todas las preguntas</button>
      <button class="mode-btn" id="mode-rnd" onclick="setMode('rnd')">Selección aleatoria (30)</button>
    </div>
    <button class="btn-start" onclick="startQuiz()">Comenzar el cuestionario →</button>
  </div>`;
  document.querySelectorAll('.ua-chip').forEach(c=>{
    c.addEventListener('click',()=>{c.classList.toggle('active');});
  });
}

let quizMode='all';
function setMode(m){
  quizMode=m;
  document.getElementById('mode-all').classList.toggle('active',m==='all');
  document.getElementById('mode-rnd').classList.toggle('active',m==='rnd');
}

function startQuiz(){
  const selected=[...document.querySelectorAll('.ua-chip.active')].map(c=>c.dataset.ua);
  if(!selected.length){alert('Selecciona al menos una UA.');return;}
  let filtered=ALL.filter(q=>selected.includes(q.u));
  shuffle(filtered);
  if(quizMode==='rnd') filtered=filtered.slice(0,30);
  pool=filtered;cur=0;score=0;ans=false;hist=[];
  updateStatsBar();
  render();
}

function render(){
  if(cur>=pool.length){showResult();return;}
  const q=pool[cur];
  const pct=Math.round((cur/pool.length)*100);
  const s=document.getElementById('screen');
  s.innerHTML=`
    <div class="progress-section">
      <div class="progress-meta">
        <span class="q-number">Pregunta ${cur+1} de ${pool.length}</span>
        <span class="q-ua-tag">${q.u}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="score-mini">
        <span class="score-ok">✓ ${score} correctas</span>
        <span class="score-ng">✗ ${cur-score} incorrectas</span>
      </div>
    </div>
    <div class="question-card">
      <div class="question-text">${q.t}</div>
      <div class="options" id="opts"></div>
    </div>
    <div id="fb"></div>
    <div class="nav-area" id="nv"></div>`;
  const opts=document.getElementById('opts');
  q.o.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="opt-letter">${L[i]}</span><span>${o}</span>`;
    b.onclick=()=>pick(i,q);
    opts.appendChild(b);
  });
}

function pick(i,q){
  if(ans)return;ans=true;
  hist.push({u:q.u,ok:i===q.a});
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q.a)b.classList.add(i===q.a?'correct':'reveal');
    if(j===i&&i!==q.a)b.classList.add('wrong');
  });
  if(i===q.a)score++;
  updateStatsBar();
  const ok=i===q.a;
  document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'ng'}">
    <span class="feedback-icon">${ok?'✓':'✗'}</span>
    <span>${ok?'<strong>Correcto.</strong>':'<strong>Incorrecto.</strong> La respuesta correcta era la opción <strong>'+L[q.a]+'</strong>: <em>'+q.o[q.a]+'</em>.'}</span>
  </div>`;
  document.getElementById('nv').innerHTML=`<button class="btn-next" onclick="next()">${cur<pool.length-1?'Siguiente pregunta':'Ver resultado'} <span class="arrow">→</span></button>`;
}

function next(){cur++;ans=false;render();}

function showResult(){
  const pct=Math.round((score/pool.length)*100);
  const em=pct>=80?'🏆':pct>=60?'👍':pct>=40?'📚':'💪';
  const msg=pct>=80?'Excelente dominio del temario':pct>=60?'Buen nivel, repasa los fallos':pct>=40?'Sigue practicando con constancia':'Revisa el temario con calma y vuelve a intentarlo';

  const uas={};
  hist.forEach(x=>{if(!uas[x.u])uas[x.u]={t:0,ok:0};uas[x.u].t++;if(x.ok)uas[x.u].ok++;});
  const uaRows=Object.entries(uas).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>{
    const p=Math.round((v.ok/v.t)*100);
    const col=p>=70?'var(--ok)':p<40?'var(--ng)':'#e08c00';
    return `<div class="ua-row">
      <span class="ua-name">${k}</span>
      <div class="ua-bar-bg"><div class="ua-bar-fill" style="width:${p}%;background:${col}"></div></div>
      <span class="ua-score">${v.ok}/${v.t}</span>
    </div>`;
  }).join('');

  const s=document.getElementById('screen');
  s.innerHTML=`<div class="result-screen">
    <span class="result-emoji">${em}</span>
    <div class="result-title">${score}<span style="font-size:.45em;color:var(--ink3)"> / ${pool.length}</span></div>
    <div class="result-pct">${pct}%</div>
    <div class="result-msg">${msg}</div>
    <div class="result-grid">
      <div class="r-card"><span class="r-card-label">Correctas</span><div class="r-card-val ok">${score}</div></div>
      <div class="r-card"><span class="r-card-label">Incorrectas</span><div class="r-card-val ng">${pool.length-score}</div></div>
    </div>
    <div class="ua-breakdown">
      <h3>Resultados por unidad temática</h3>
      ${uaRows}
    </div>
    <button class="btn-retry" onclick="showStart()">Volver al inicio</button>
  </div>`;
}

showStart();
</script>
</body>
</html>
